server:
  name: ggb_server
  port: 8080
  mode: "dev"  #test、prod、dev

db:
  host: "localhost"
  port: 3306
  user: "root"
  password: ""   # 通过环境变量 DB_PASSWORD 注入，不要把真实密码提交到仓库
  name: "ggb_gen"
  max_idle_conns: 10
  max_open_conns: 100

jwt:
  secret: ""     # 通过环境变量 JWT_SECRET 注入，必须非空
  expire: 720    # 分钟

static:
  path: "static/upload"

log:
  level: "info" # debug, info, warn, error, fatal
  file_path: "logs/app.log"
  enable_console_output: true

ai_model:
  deepseek:
    apiKey: ""   # 通过环境变量 AI_MODEL_DEEPSEEK_APIKEY 注入
  stepfun:
    apiKey: ""   # 通过环境变量 AI_MODEL_STEPFUN_APIKEY 注入
  doubao:
    apiKey: ""   # 通过环境变量 AI_MODEL_DOUBAO_APIKEY 注入
